
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phoenix Talons - Monthly Kills</title>
<style>
*{box-sizing:border-box}
body{margin:0;padding:20px;background:#15121e;color:#fff;font-family:Arial,sans-serif}
header{text-align:center;padding:20px 0}
h1{color:#f3bd55;margin-bottom:5px}
.subtitle{color:#b9a9ce}
.card{background:#251d32;padding:18px;border:1px solid #59416d;border-radius:14px;margin:16px 0}
input,button{width:100%;padding:13px;margin:6px 0;border-radius:8px;border:0;font-size:16px}
input{background:#eee;color:#222}
button{background:#d99b36;color:#211629;font-weight:bold;cursor:pointer}
button.secondary{background:#59416d;color:white}
button.danger{background:#713d4b;color:white}
button:disabled{opacity:.45;cursor:not-allowed}
.stats{display:flex;gap:10px;text-align:center}
.stat{flex:1;background:#352642;padding:12px;border-radius:10px;min-width:0}
.stat strong{display:block;color:#f3bd55;font-size:20px;overflow-wrap:anywhere}
table{width:100%;border-collapse:collapse}
th,td{padding:11px 5px;text-align:left;border-bottom:1px solid #59416d}
th{color:#f3bd55}
.rank{color:#f3bd55;font-weight:bold}
.delete{background:#713d4b;color:white;padding:7px;margin:0}
#status{color:#b9a9ce;font-size:14px;text-align:center}
.hidden{display:none}
footer{text-align:center;color:#a99bb8;margin-top:25px}
@media(max-width:480px){body{padding:12px}.stats{gap:5px}.stat{padding:9px 4px}.stat strong{font-size:16px}th,td{font-size:14px}}
</style>
</head>
<body>
<header>
<h1>🔥 PHOENIX TALONS 🔥</h1>
<div class="subtitle">MONTHLY KILLS LEADERBOARD</div>
</header>

<div class="card">
<div id="status">Connecting to leaderboard…</div>
<button id="loginBtn" class="secondary" onclick="signIn()">LEADERSHIP SIGN IN</button>
<button id="logoutBtn" class="secondary hidden" onclick="signOutUser()">SIGN OUT</button>
</div>

<div class="card stats">
<div class="stat">Players<strong id="players">0</strong></div>
<div class="stat">Total kills<strong id="total">0</strong></div>
<div class="stat">Top player<strong id="leader">-</strong></div>
</div>

<div class="card">
<h3>⚔️ Add player results</h3>
<p class="subtitle">Only PT leadership can enter or change results.</p>
<input id="name" placeholder="Player name" autocomplete="off">
<input id="kills" type="number" min="0" step="1" placeholder="Monthly kills">
<button id="addBtn" onclick="addPlayer()" disabled>ADD / UPDATE PLAYER</button>
</div>

<div class="card">
<h3>🏆 Team rankings</h3>
<table>
<thead><tr><th>Rank</th><th>Player</th><th>Kills</th><th></th></tr></thead>
<tbody id="board"><tr><td colspan="4">Loading results…</td></tr></tbody>
</table>
</div>

<div class="card">
<button onclick="exportData()">DOWNLOAD RESULTS (CSV)</button>
<button id="clearBtn" class="danger" onclick="clearData()" disabled>CLEAR LEADERBOARD</button>
</div>
<footer>RISE. FIGHT. CONQUER.<br>PHOENIX TALONS</footer>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/13.3.0/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/13.3.0/firebase-auth.js";
import { getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot, getDocs } from "https://www.gstatic.com/firebasejs/13.3.0/firebase-firestore.js";

const firebaseConfig = {
apiKey: "AIzaSyCDBIYVNVkmyY3bIIKmttI9akfxpNRUF8U",
authDomain: "phoenix-talons-tools.firebaseapp.com",
projectId: "phoenix-talons-tools",
storageBucket: "phoenix-talons-tools.firebasestorage.app",
messagingSenderId: "959564431396",
appId: "1:959564431396:web:5cdaaf4e19496e2fd698b1",
measurementId: "G-J3F9NBM8VM"
};

const ADMIN_EMAIL = "phoenixtalons.leadership@gmail.com";
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const provider = new GoogleAuthProvider();
let data = [];
let isAdmin = false;

function status(message) {
document.getElementById("status").textContent = message;
}

function setAdminUI(user) {
isAdmin = !!user && (user.email || "").toLowerCase() === ADMIN_EMAIL;
document.getElementById("loginBtn").classList.toggle("hidden", !!user);
document.getElementById("logoutBtn").classList.toggle("hidden", !user);
document.getElementById("addBtn").disabled = !isAdmin;
document.getElementById("clearBtn").disabled = !isAdmin;
if (isAdmin) status("Signed in as PT leadership: " + user.email);
else if (user) status("This Google account cannot edit results.");
else status("Public view. Sign in with the PT leadership Google account to edit.");
render();
}

window.signIn = async function() {
try { await signInWithPopup(auth, provider); }
catch(error) { status("Sign-in failed: " + error.message); }
};

window.signOutUser = async function() {
try { await signOut(auth); }
catch(error) { status("Sign-out failed: " + error.message); }
};

onAuthStateChanged(auth, user => setAdminUI(user));

onSnapshot(collection(db, "monthlyKills"), snapshot => {
data = snapshot.docs.map(d => ({id:d.id, ...d.data()}));
render();
}, error => status("Could not load results: " + error.message));

window.addPlayer = async function() {
if (!isAdmin) return;
const name = document.getElementById("name").value.trim();
const kills = Number(document.getElementById("kills").value);
if (!name || !Number.isSafeInteger(kills) || kills < 0) {
alert("Enter a player name and a whole number of kills.");
return;
}
const id = encodeURIComponent(name.toLowerCase());
try {
await setDoc(doc(db, "monthlyKills", id), {
name, kills, updatedAt: new Date().toISOString()
});
document.getElementById("name").value = "";
document.getElementById("kills").value = "";
status("Result saved for " + name + ".");
} catch(error) { status("Could not save result: " + error.message); }
};

window.removePlayer = async function(id) {
if (!isAdmin) return;
if (confirm("Remove this player from the leaderboard?")) {
try { await deleteDoc(doc(db, "monthlyKills", id)); }
catch(error) { status("Could not remove player: " + error.message); }
}
};

function render() {
const sorted = [...data].sort((a,b) => (Number(b.kills)||0) - (Number(a.kills)||0));
document.getElementById("players").textContent = data.length;
document.getElementById("total").textContent = data.reduce((sum,p) => sum + (Number(p.kills)||0), 0).toLocaleString();
document.getElementById("leader").textContent = sorted.length ? sorted[0].name : "-";
document.getElementById("board").innerHTML = sorted.length ? sorted.map((p,i) => `
<tr>
<td class="rank">${i+1}</td>
<td>${escapeText(p.name)}</td>
<td>${(Number(p.kills)||0).toLocaleString()}</td>
<td>${isAdmin ? `<button class="delete" onclick="removePlayer('${escapeText(p.id)}')">X</button>` : ""}</td>
</tr>`).join("") : '<tr><td colspan="4">No results have been entered yet.</td></tr>';
}

function escapeText(value) {
return String(value).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);
}

window.exportData = function() {
const sorted = [...data].sort((a,b) => (Number(b.kills)||0) - (Number(a.kills)||0));
const csv = "Rank,Player,Monthly Kills\n" + sorted.map((p,i) => [i+1, '"' + String(p.name).replace(/"/g,'""') + '"', Number(p.kills)||0].join(",")).join("\n");
const a = document.createElement("a");
a.href = URL.createObjectURL(new Blob([csv], {type:"text/csv"}));
a.download = "PT-monthly-kills.csv";
a.click();
URL.revokeObjectURL(a.href);
};

window.clearData = async function() {
if (!isAdmin) return;
if (confirm("Delete all leaderboard results? This cannot be undone.")) {
try {
const snapshot = await getDocs(collection(db, "monthlyKills"));
await Promise.all(snapshot.docs.map(d => deleteDoc(d.ref)));
status("Leaderboard cleared.");
} catch(error) { status("Could not clear leaderboard: " + error.message); }
}
};
</script>
</body>
</html>
